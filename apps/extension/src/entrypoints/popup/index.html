<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Brain</title>
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img class="brand-mark" src="/icon/48.png" alt="" width="28" height="28" />
        <span class="brand-name">second brain</span>
      </header>

      <section id="loading" class="stack" aria-busy="true" aria-label="Loading">
        <div class="skeleton skeleton-button"></div>
        <div class="skeleton skeleton-line"></div>
      </section>

      <section id="not-connected" class="stack" hidden>
        <div class="stack-tight">
          <h1>Connect this browser</h1>
          <p class="muted">
            Create a device key in Settings, then paste it here.
          </p>
        </div>
        <p class="notice" id="connect-notice" role="status" hidden></p>
        <form id="connect-form" class="stack" novalidate>
          <div class="field">
            <label for="key-input">Device key</label>
            <input
              id="key-input"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="sbx_..."
              aria-describedby="connect-error"
            />
            <p class="error" id="connect-error" role="alert" hidden></p>
          </div>
          <button class="button button-primary" id="connect-btn" type="submit">
            Connect
          </button>
        </form>
        <a class="link" id="settings-link" href="#" target="_blank" rel="noreferrer">
          Open Settings to create a key
        </a>
      </section>

      <section id="connected" class="stack" hidden>
        <button class="button button-primary" id="save-btn" type="button">
          Save this page
        </button>
        <div class="result" id="save-result" role="status" aria-live="polite" hidden>
          <p class="result-title" id="save-result-title"></p>
          <p class="result-detail" id="save-result-detail"></p>
        </div>
        <footer class="account">
          <span class="email" id="email-status"></span>
          <button class="text-button" id="disconnect-btn" type="button">
            Disconnect
          </button>
        </footer>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
